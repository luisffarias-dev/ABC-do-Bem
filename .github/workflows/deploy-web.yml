name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/' # IMPORTANTE: Executa a action apenas se houver mudanças no front

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (necessário para algumas dependências Android/Gradle se houver, opcional mas seguro)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Ou a versão exata que você está usando
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./nome-da-pasta-do-front  # Substitua pelo nome exato da sua pasta front

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/nome-do-repositorio/"
        working-directory: ./nome-da-pasta-do-front  # Substitua pelo nome exato da sua pasta front
        # NOTA: Troque "/nome-do-repositorio/" pelo nome exato do seu repositório no GitHub 
        # (ex: /LiarsDeckApk/). Se for um site de usuário (usuario.github.io), remova a flag --base-href.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./nome-da-pasta-do-front/build/web # Caminho onde o build web é gerado
          publish_branch: gh-pages # Branch onde os arquivos estáticos serão publicados